# Training with W&B metrics and best/last checkpoints.
# uv run train-discriminator
# Config-only dry run (no data/model downloads):
# uv run train-discriminator --cfg job --resolve
# Lightning fast-dev mode (one batch per split, disables logging/checkpoints):
# uv run train-discriminator trainer.fast_dev_run=true
# Longer runs: trainer.max_steps=-1 trainer.max_epochs=3
# Use trainer.val_check_interval=1.0 for validation once per epoch.
# Use trainer.limit_val_batches=1.0 to evaluate the entire validation split.
# Resume: resume_from=runs/discriminator/<run-id>/checkpoints/last.ckpt
# Resume with the same model/data settings and a higher step/epoch limit.
# Model/optimizer/scheduler state resumes; mid-epoch shuffle position does not.
defaults:
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

seed: 42
output: runs/discriminator
resume_from: null
wandb:
  project: speeling-good
  entity: null
  name: null
model:
  model_name: answerdotai/ModernBERT-base
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_checkpointing: false
data:
  directory: data/fineweb
  validation_fraction: 0.2
  batch_size: 2
  max_length: 128
  num_workers: 0
trainer:
  accelerator: auto
  devices: 1
  precision: 32-true
  max_epochs: 2
  max_steps: 64
  limit_val_batches: 2
  val_check_interval: 2
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  num_sanity_val_steps: 1
  fast_dev_run: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
