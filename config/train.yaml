# First full fine-tuning run on prepared FineWeb annotations.
# uv run train-discriminator --config-name train
# Requires a GPU with bfloat16 support. Effective batch size: 8 x 4 = 32.
# Resume with the same model/data settings:
# uv run train-discriminator --config-name train resume_from=runs/discriminator/<run-id>/checkpoints/last.ckpt
defaults:
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
  - _self_

seed: 42
output: runs/discriminator
resume_from: null
wandb:
  project: speeling-good
  entity: null
  name: null
model:
  model_name: answerdotai/ModernBERT-base
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_checkpointing: true
  # Multiplier for every supervised token in originally clean passages.
  clean_passage_weight: 0.2
early_stopping:
  enabled: true
  # Counts validation checks without improvement, not training epochs.
  patience: 3
  min_delta: 0.0
data:
  directory: data/fineweb
  validation_fraction: 0.2
  batch_size: 8
  max_length: 512
  num_workers: 4
trainer:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  max_epochs: 6
  max_steps: -1
  limit_val_batches: 1.0
  val_check_interval: 1.0
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  num_sanity_val_steps: 2
  fast_dev_run: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
