[project]
name = "speeling-good"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.2.0",
    "hydra-core>=1.3.2,<1.4",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    # Keep datasets' early-stop streaming workaround active (datasets#8793).
    "pyarrow>=21,<=24.0.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "torch",
    "tqdm>=4.70.1",
]

[project.scripts]
prepare-fineweb = "speeling_good.cli.prepare_fineweb:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]
